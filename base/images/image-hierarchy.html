<title>Azure Linux 4 KIWI Image Hierarchy</title>
<style>
:root {
    color-scheme: light dark;
    --background: #f5f7fa;
    --surface: #ffffff;
    --surface-alt: #f0f4f8;
    --text: #17212b;
    --muted: #596773;
    --border: #c9d3dc;
    --accent: #0078d4;
    --accent-soft: #e6f2fb;
    --selected: #dff6dd;
    --shadow: 0 2px 12px rgba(20, 40, 60, 0.08);
}
@media (prefers-color-scheme: dark) {
    :root {
        --background: #111820;
        --surface: #18222c;
        --surface-alt: #202d39;
        --text: #e8eef3;
        --muted: #acbac5;
        --border: #40515f;
        --accent: #55aef0;
        --accent-soft: #183c57;
        --selected: #214c2a;
        --shadow: none;
    }
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
    margin: 0;
    color: var(--text);
    background: var(--background);
    font: 15px/1.55 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
header {
    padding: 2rem max(1.5rem, calc((100vw - 1500px) / 2));
    color: white;
    background: linear-gradient(120deg, #005a9e, #0078d4);
}
header h1 { margin: 0 0 0.4rem; font-size: clamp(1.7rem, 3vw, 2.6rem); }
header p { margin: 0; opacity: 0.9; }
nav {
    position: sticky;
    top: 0;
    z-index: 20;
    display: flex;
    gap: 0.6rem;
    padding: 0.7rem max(1.5rem, calc((100vw - 1500px) / 2));
    overflow-x: auto;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
}
nav a {
    padding: 0.35rem 0.65rem;
    color: var(--accent);
    white-space: nowrap;
    text-decoration: none;
    border-radius: 0.35rem;
}
nav a:hover { background: var(--accent-soft); }
main { max-width: 1500px; margin: auto; padding: 1.5rem; }
article {
    margin-bottom: 1.5rem;
    padding: clamp(1rem, 3vw, 2rem);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 0.6rem;
    box-shadow: var(--shadow);
}
.source {
    float: right;
    color: var(--muted);
    font-size: 0.85rem;
}
h1, h2, h3 { line-height: 1.25; }
article > h1:first-of-type { margin-top: 0; }
h2 { margin-top: 2rem; padding-bottom: 0.25rem; border-bottom: 1px solid var(--border); }
code {
    padding: 0.1rem 0.3rem;
    color: var(--text);
    background: var(--surface-alt);
    border-radius: 0.25rem;
}
pre {
    padding: 1rem;
    overflow: auto;
    background: var(--surface-alt);
    border: 1px solid var(--border);
    border-radius: 0.4rem;
}
pre code { padding: 0; background: transparent; }
.table-card {
    margin: 1rem 0 1.75rem;
    border: 1px solid var(--border);
    border-radius: 0.45rem;
    overflow: hidden;
}
.table-tools {
    display: flex;
    gap: 0.6rem;
    align-items: center;
    padding: 0.65rem;
    background: var(--surface-alt);
    border-bottom: 1px solid var(--border);
}
.table-tools input {
    width: min(28rem, 100%);
    padding: 0.45rem 0.65rem;
    color: var(--text);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 0.35rem;
}
.table-count { margin-left: auto; color: var(--muted); white-space: nowrap; }
.table-scroll { max-height: 70vh; overflow: auto; }
table {
    width: 100%;
    border-collapse: separate;
    border-spacing: 0;
    font-size: 0.88rem;
}
th, td {
    min-width: 7rem;
    padding: 0.45rem 0.6rem;
    text-align: left;
    vertical-align: top;
    border-right: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
}
th {
    position: sticky;
    top: 0;
    z-index: 2;
    background: var(--surface-alt);
}
th:first-child, td:first-child {
    position: sticky;
    left: 0;
    z-index: 1;
    background: var(--surface);
}
th:first-child { z-index: 3; background: var(--surface-alt); }
td.selected { text-align: center; font-weight: 700; background: var(--selected); }
tbody tr:hover td { outline: 1px solid var(--accent); outline-offset: -1px; }
tr:last-child td { border-bottom: 0; }
th:last-child, td:last-child { border-right: 0; }
.empty { padding: 1rem; color: var(--muted); text-align: center; }
@media print {
    nav, .table-tools { display: none; }
    body, article { background: white; color: black; }
    article { border: 0; box-shadow: none; break-after: page; }
    .table-scroll { max-height: none; overflow: visible; }
    th { position: static; }
}
</style>

<script id="document-data" type="application/json">{"documents": [{"label": "Hierarchy overview", "source": "README.md", "nodes": [{"type": "heading", "level": 1, "text": "Azure Linux 4 KIWI image hierarchy"}, {"type": "paragraph", "text": "`AzureLinux.kiwi` is the shared entry point for all Azure Linux 4 images. The image registry selects one leaf profile for each image."}, {"type": "paragraph", "text": "The entry point uses non-nested KIWI includes:"}, {"type": "list", "items": ["`profiles/profiles.xml` defines leaf profiles and their inheritance.", "`profiles/config.xml` contains profile-scoped preferences and repositories.", "`profiles/packages.xml` contains package groups and the installer user."]}, {"type": "heading", "level": 2, "text": "Package hierarchy"}, {"type": "paragraph", "text": "The package profiles are layered from broad to specific:"}, {"type": "code", "language": "text", "text": "BootableCore\n\u2514\u2500\u2500 CloudCore\n    \u251c\u2500\u2500 VmBaseCore\n    \u251c\u2500\u2500 OnePBase\n    \u2514\u2500\u2500 MarketplaceBase\n\nContainerCore\nDistrolessCore\n\u2514\u2500\u2500 DistrolessBase\n\nWslCore\nMinimalOsCore -> BootableCore\nInstallerCore -> BootableCore"}, {"type": "heading", "level": 3, "text": "Core and base naming"}, {"type": "paragraph", "text": "`Core` identifies a foundational package set shared across a broad image category. Core profiles contain the smallest common layer at that level of the hierarchy, such as `BootableCore`, `CloudCore`, or `DistrolessCore`."}, {"type": "paragraph", "text": "`Base` identifies the common baseline for a narrower family of sibling images. Base profiles build on an applicable core and contain packages shared by every variant in that family, such as `OnePBase`, `MarketplaceBase`, or `DistrolessBase`."}, {"type": "paragraph", "text": "These names are project conventions, not KIWI language features. KIWI treats core and base profiles as ordinary profiles. In `VmBaseCore`, `vm-base` is the image fam <script>
"use strict";
const data = JSON.parse(document.getElementById("document-data").textContent);
const content = document.getElementById("content");
const navigation = document.getElementById("navigation");

function slug(value) {
    return value.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
}

function appendInline(parent, text) {
    text.split(/(`[^`]+`)/g).filter(Boolean).forEach(part => {
        if (part.startsWith("`") && part.endsWith("`")) {
            const code = document.createElement("code");
            code.textContent = part.slice(1, -1);
            parent.append(code);
        } else {
            parent.append(document.createTextNode(part));
        }
    });
}

function renderTable(node, tableIndex) {
    const card = document.createElement("div");
    card.className = "table-card";

    const tools = document.createElement("div");
    tools.className = "table-tools";
    const search = document.createElement("input");
    search.type = "search";
    search.placeholder = "Filter this table...";
    search.setAttribute("aria-label", `Filter table ${tableIndex + 1}`);
    const count = document.createElement("span");
    count.className = "table-count";
    tools.append(search, count);

    const scroll = document.createElement("div");
    scroll.className = "table-scroll";
    const table = document.createElement("table");
    const head = table.createTHead().insertRow();
    node.headers.forEach(header => {
        const th = document.createElement("th");
        th.scope = "col";
        appendInline(th, header);
        head.append(th);
    });
    const body = table.createTBody();

    function populate(query = "") {
        body.replaceChildren();
        const normalized = query.trim().toLowerCase();
        const rows = node.rows.filter(row =>
            !normalized || row.some(cell => cell.toLowerCase().includes(normalized))
        );
        rows.forEach(row => {
            const tr = body.insertRow();
            node.headers.forEach((_, column) => {
                const td = tr.insertCell();
                const value = row[column] || "";
                appendInline(td, value);
                if (value === "X") td.className = "selected";
            });
        });
        count.textContent = `${rows.length} / ${node.rows.length} rows`;
        if (!rows.length) {
            const tr = body.insertRow();
            const td = tr.insertCell();
            td.colSpan = node.headers.length;
            td.className = "empty";
            td.textContent = "No matching rows";
        }
    }

    search.addEventListener("input", () => populate(search.value));
    populate();
    scroll.append(table);
    card.append(tools, scroll);
    return card;
}

let tableIndex = 0;
data.documents.forEach((documentData, documentIndex) => {
    const article = document.createElement("article");
    article.id = slug(documentData.label);
    const source = document.createElement("span");
    source.className = "source";
    source.textContent = documentData.source;
    article.append(source);

    const link = document.createElement("a");
    link.href = `#${article.id}`;
    link.textContent = documentData.label;
    navigation.append(link);

    documentData.nodes.forEach(node => {
        if (node.type === "heading") {
            const level = documentIndex === 0 ? node.level : Math.min(node.level + 1, 6);
            const heading = document.createElement(`h${level}`);
            appendInline(heading, node.text);
            article.append(heading);
        } else if (node.type === "paragraph") {
            const paragraph = document.createElement("p");
            appendInline(paragraph, node.text);
            article.append(paragraph);
        } else if (node.type === "list") {
            const list = document.createElement("ul");
            node.items.forEach(item => {
                const li = document.createElement("li");
                appendInline(li, item);
                list.append(li);
            });
            article.append(list);
        } else if (node.type === "code") {
            const pre = document.createElement("pre");
            const code = document.createElement("code");
            code.textContent = node.text;
            if (node.language) code.dataset.language = node.language;
            pre.append(code);
            article.append(pre);
        } else if (node.type === "table") {
            article.append(renderTable(node, tableIndex++));
        }
    });
    content.append(article);
});
</script>
</body>
</html>
